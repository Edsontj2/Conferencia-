name: Painel do Carro (APK)

on:
  push:
    paths:
      - "carlauncher/**"
      - ".github/workflows/carlauncher.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carlauncher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk PainelDoCarro.apk

      - name: Guardar APK (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: PainelDoCarro-apk
          path: carlauncher/PainelDoCarro.apk

      - name: Publicar APK para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: painel-do-carro
          name: Painel do Carro (APK)
          body: "APK mais recente do Painel do Carro. Baixe o arquivo PainelDoCarro.apk no celular e instale."
          prerelease: true
          make_latest: false
          files: carlauncher/PainelDoCarro.apk
