name: Painel do Carro (APK)

on:
  push:
    paths:
      - "carlauncher/**"
      - ".github/workflows/carlauncher.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carlauncher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk PainelDoCarro.apk

      - name: Testar consulta do limite da via (OpenStreetMap)
        continue-on-error: true
        working-directory: .
        run: |
          q='[out:json][timeout:8];way(around:30,-23.5614,-46.6559)[highway][highway!~"^(footway|cycleway|path|steps|pedestrian|track|bridleway|corridor|platform|proposed|construction)$"];out tags geom;'
          for ep in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.kumi.systems/api/interpreter; do
            echo "== $ep"
            curl -sS -m 25 -A "PainelDoCarro/1.0 (Android)" --data-urlencode "data=$q" "$ep" -o out.json -w "HTTP %{http_code} em %{time_total}s\n" || continue
            python3 -c "import json; d=json.load(open('out.json')); print([(e['tags'].get('name'), e['tags'].get('highway'), e['tags'].get('maxspeed'), len(e.get('geometry', []))) for e in d['elements']])" || head -c 300 out.json
          done

      - name: Guardar APK (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: PainelDoCarro-apk
          path: carlauncher/PainelDoCarro.apk

      - name: Publicar APK para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: painel-do-carro
          name: Painel do Carro (APK)
          body: "APK mais recente do Painel do Carro. Baixe o arquivo PainelDoCarro.apk no celular e instale."
          prerelease: true
          make_latest: false
          files: carlauncher/PainelDoCarro.apk
