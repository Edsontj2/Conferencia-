name: Painel do Carro (APK)

on:
  push:
    paths:
      - "carlauncher/**"
      - ".github/workflows/carlauncher.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carlauncher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk PainelDoCarro.apk

      - name: Testar consulta do limite da via (OpenStreetMap)
        continue-on-error: true
        working-directory: .
        run: |
          for p in "-23.5614,-46.6559" "-23.5505,-46.6333" "-22.9711,-43.1822"; do
            lat=${p%,*}; lon=${p#*,}
            curl -sS -m 30 -A "PainelDoCarro/1.0 (Android)" \
              --data-urlencode "data=[out:json][timeout:8];way(around:30,$lat,$lon)[highway][highway!~\"^(footway|cycleway|path|steps|pedestrian|track|bridleway|corridor|platform|proposed|construction)\$\"];out tags geom;" \
              https://overpass-api.de/api/interpreter \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('$p', [(e['tags'].get('name'), e['tags'].get('highway'), e['tags'].get('maxspeed'), len(e.get('geometry', []))) for e in d['elements']])"
          done

      - name: Guardar APK (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: PainelDoCarro-apk
          path: carlauncher/PainelDoCarro.apk

      - name: Publicar APK para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: painel-do-carro
          name: Painel do Carro (APK)
          body: "APK mais recente do Painel do Carro. Baixe o arquivo PainelDoCarro.apk no celular e instale."
          prerelease: true
          make_latest: false
          files: carlauncher/PainelDoCarro.apk
